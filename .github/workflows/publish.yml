name: Publish

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Check the release tag matches pyproject.toml's version
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' pyproject.toml)"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "pyproject.toml has version $VERSION but the release tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  # Publishing is a separate job so no repository-controlled code runs while the
  # OIDC token for PyPI Trusted Publishing (no stored credentials) is available.
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
